<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="50%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a0a0a8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#606068" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#909098" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16"/>

  <!-- Subtle Grid System -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="880" y1="0" x2="880" y2="360"/>
    <line x1="1040" y1="0" x2="1040" y2="360"/>

    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Sound Waves (Additive Harmonics & Envelope Decay) -->
  <path d="M 600 240 Q 640 180, 680 240 T 760 240 T 840 240 T 920 240 T 1000 240 T 1080 240 T 1140 240"
        fill="none" stroke="url(#wave2)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <path d="M 520 240 Q 560 140, 600 240 T 680 240 T 760 240 T 840 240 T 920 240 T 1000 240 T 1080 240 T 1160 240"
        fill="none" stroke="url(#wave1)" stroke-width="2.5"/>

  <!-- Sawtooth Graphic Simulation -->
  <path d="M 640 130 L 670 90 L 670 130 L 700 90 L 700 130 L 730 90 L 730 130 L 760 90 L 760 130 L 790 90 L 790 130 L 820 90 L 820 130 L 850 90 L 850 130"
        fill="none" stroke="#52525b" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Envelope Dampening Curve -->
  <path d="M 520 100 C 600 105, 800 210, 1140 235"
        fill="none" stroke="#71717a" stroke-width="1.5" stroke-dasharray="2 3" stroke-opacity="0.8"/>

  <!-- Left Header & Typography -->
  <text x="80" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="64" font-weight="800" letter-spacing="-2" fill="#fafafa">
    pymusic
  </text>

  <text x="82" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="400" letter-spacing="4" fill="#a1a1aa">
    ADDITIVE SOUND SYNTHESIZER
  </text>

  <text x="82" y="240" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace"
        font-size="13" font-weight="400" letter-spacing="0.5" fill="#71717a">
    f(n) = 440 * 2^((n - 69) / 12)  |  s(t) = sum(a_k * sin(2*pi*k*f*t)) * exp(-decay*t)
  </text>

  <!-- Technical Spec Tags -->
  <g transform="translate(82, 280)">
    <rect width="90" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="45" y="16" font-family="monospace" font-size="11" fill="#d4d4d8" text-anchor="middle">44.1 kHz</text>

    <rect x="100" width="100" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="150" y="16" font-family="monospace" font-size="11" fill="#d4d4d8" text-anchor="middle">Float64 PCM</text>

    <rect x="210" width="125" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="272" y="16" font-family="monospace" font-size="11" fill="#d4d4d8" text-anchor="middle">Tanh Saturation</text>
  </g>
</svg>
